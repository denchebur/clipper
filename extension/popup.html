<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px system-ui, sans-serif; width: 300px; margin: 12px; }
    h1 { font-size: 15px; margin: 0 0 8px; }
    label { display: flex; justify-content: space-between; align-items: center; margin: 4px 0; }
    input { width: 90px; }
    input#coreUrl { width: 170px; }
    button { width: 100%; padding: 6px; margin-top: 8px; cursor: pointer; }
    #status { margin: 6px 0; color: #555; }
    ul { padding-left: 16px; margin: 4px 0; }
    li { margin: 2px 0; }
  </style>
</head>
<body>
  <h1>Clipper</h1>
  <div id="status">Проверяю ядро…</div>
  <button id="clipNow">✂ Клип сейчас</button>

  <h1 style="margin-top:12px">Настройки</h1>
  <label>Адрес ядра <input id="coreUrl"></label>
  <label>Окно, с <input id="windowSeconds" type="number" min="3"></label>
  <label>Фон, с <input id="baselineSeconds" type="number" min="30"></label>
  <label>Во сколько раз выше <input id="ratio" type="number" step="0.1" min="1"></label>
  <label>Мин. сообщений в окне <input id="minMessages" type="number" min="1"></label>
  <label>Пауза после всплеска, с <input id="cooldownSeconds" type="number" min="0"></label>
  <button id="save">Сохранить (перезагрузите вкладку с чатом)</button>

  <h1 style="margin-top:12px">Последние всплески</h1>
  <ul id="log"></ul>

  <script src="shared/defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
